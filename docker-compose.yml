services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${DOMAIN}
    volumes:
      - checkin_data:/data
    # Loopback only: reach the app through your own reverse proxy (nginx...) or the Caddy profile below
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    stop_grace_period: 15s

  # Optional bundled HTTPS proxy (Let's Encrypt): `docker compose --profile caddy up -d --build`.
  # Skip it when the server already runs nginx/Caddy on ports 80/443. Camera scanning and PWA need HTTPS.
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  checkin_data:
  caddy_data:
  caddy_config:
